<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hội Viên CLB</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:    #c9a84c;
      --gold-lt: #e8cc7a;
      --dark:    #0d0d0d;
      --dark2:   #141414;
      --dark3:   #1c1c1c;
      --border:  rgba(201,168,76,0.18);
      --text:    #e8e2d5;
      --muted:   #7a7468;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(201,168,76,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 90%, rgba(201,168,76,0.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 2px; overflow: hidden;
      animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .stripe {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-lt), var(--gold), transparent);
    }
    .header {
      padding: 2.2rem 2rem 1.8rem;
      display: flex; gap: 1.4rem; align-items: flex-start;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .stt-badge {
      position: absolute; top: 1.3rem; right: 1.6rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 2.5px;
      color: var(--gold); text-transform: uppercase; opacity: .65;
    }
    .avatar-circle {
      width: 70px; height: 70px; border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: var(--dark3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 27px; font-weight: 600; color: var(--gold);
      flex-shrink: 0;
    }
    .avatar-img {
      width: 70px; height: 70px; border-radius: 50%;
      border: 1.5px solid var(--gold);
      object-fit: cover; display: block; flex-shrink: 0;
    }
    .name-block { padding-top: 4px; }
    .name-block h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 25px; font-weight: 600; color: #fff;
      line-height: 1.15; margin-bottom: 8px; letter-spacing: .3px;
    }
    .role-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.22);
      border-radius: 2px; padding: 3px 10px;
      font-size: 10.5px; color: var(--gold-lt); letter-spacing: .6px;
    }
    .info-section { padding: 1.5rem 2rem; }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 1.1rem;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .info-item {
      display: grid; grid-template-columns: 26px 1fr;
      gap: 0 12px; align-items: start;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.035);
    }
    .info-item:last-child { border-bottom: none; }
    .info-icon-wrap {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      margin-top: 3px;
    }
    .info-icon-wrap svg {
      width: 13px; height: 13px;
      stroke: var(--gold); fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      opacity: .7;
    }
    .info-label {
      font-size: 9px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
    }
    .info-value { font-size: 13.5px; color: var(--text); line-height: 1.45; }
    .card-footer {
      margin: 0 2rem 1.8rem;
      border-top: 1px solid var(--border);
      padding-top: 1.3rem;
      display: flex; gap: 10px;
    }
    .btn-primary {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--gold); color: #0d0d0d;
      text-decoration: none; padding: 11px 0;
      border-radius: 2px; font-size: 12px; font-weight: 500; letter-spacing: .4px;
      transition: background .2s, transform .15s;
    }
    .btn-primary:hover { background: var(--gold-lt); transform: translateY(-1px); }
    .btn-primary svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .btn-back {
      display: flex; align-items: center; justify-content: center;
      width: 42px; border: 1px solid var(--border);
      border-radius: 2px; color: var(--muted);
      text-decoration: none; font-size: 18px;
      transition: border-color .2s, color .2s; flex-shrink: 0;
    }
    .btn-back:hover { border-color: var(--gold); color: var(--gold); }
    /* Error */
    .error-page { text-align: center; z-index: 1; position: relative; }
    .error-page .err-icon { font-size: 46px; margin-bottom: 1rem; opacity: .4; }
    .error-page h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; font-weight: 400; color: #fff; margin-bottom: 8px;
    }
    .error-page p { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }
    .error-page a {
      display: inline-block; padding: 10px 24px;
      border: 1px solid var(--border); color: var(--gold);
      text-decoration: none; font-size: 12px; letter-spacing: 1px; border-radius: 2px;
    }
    .error-page a:hover { border-color: var(--gold); }
  </style>
</head>
<body>
<div id="root"></div>
<script>
// ================================================================
//  DỮ LIỆU HỘI VIÊN — Chỉnh sửa tại đây, không cần file ngoài
// ================================================================
var members = {
  "vu-ngoc-cuong-1": {
    id:"vu-ngoc-cuong-1", stt:1, ten:"Vũ Ngọc Cường", sdt:"0938688679",
    ngaysinh:"27/06/1985", cccd:"15085011371",
    diachi:"Số 10 lô O, đường 14 - Hoàng Quốc Việt, KDC Phú Mỹ, P. Tân Mỹ, TP.HCM",
    nghenghiep:"GĐ - Cty CP Sứ Kỹ Thuật Hoàng Liên Sơn Sài Gòn", biensoxe:"51K-808.79", avatar:""
  },
  "nguyen-luong-binh-2": {
    id:"nguyen-luong-binh-2", stt:2, ten:"Nguyễn Lương Bình", sdt:"0903814516",
    ngaysinh:"12/04/1967", cccd:"15067500592",
    diachi:"09 Hưng Thái 1, Phú Mỹ Hưng, P. Tân Hưng, TP.HCM",
    nghenghiep:"Cty CP Tiến Việt", biensoxe:"51D-359.63", avatar:""
  },
  "phan-xuan-hai-3": {
    id:"phan-xuan-hai-3", stt:3, ten:"Phan Xuân Hải", sdt:"0908295959",
    ngaysinh:"16/09/1965", cccd:"22065008923",
    diachi:"Số 23 đường 28, KP2, P. Bình Trưng, TP.HCM",
    nghenghiep:"Cán bộ hưu trí", biensoxe:"(Không có)", avatar:""
  },
  "ho-thanh-tuan-4": {
    id:"ho-thanh-tuan-4", stt:4, ten:"Hồ Thanh Tuấn", sdt:"0933888818",
    ngaysinh:"15/12/1976", cccd:"94076000001",
    diachi:"54 Nguyễn Thị Thập, P. Tân Hưng, TP.HCM",
    nghenghiep:"Cty CP Ngọc Trai Hoàng Gia", biensoxe:"51B-516.91", avatar:""
  },
  "pham-sy-trung-5": {
    id:"pham-sy-trung-5", stt:5, ten:"Phạm Sỹ Trung", sdt:"0903824985",
    ngaysinh:"20/05/1967", cccd:"15067004553",
    diachi:"16F Phùng Khắc Khoan, P. Đa Kao, TP.HCM",
    nghenghiep:"Kiến trúc sư", biensoxe:"51G-758.20", avatar:""
  },
  "nguyen-quoc-bao-6": {
    id:"nguyen-quoc-bao-6", stt:6, ten:"Nguyễn Quốc Bảo", sdt:"0973734242",
    ngaysinh:"19/05/1968", cccd:"45068009268",
    diachi:"16F 3/2 Hoàng Diệu, P. Phú Nhuận, TP.HCM",
    nghenghiep:"Kiến trúc sư", biensoxe:"51K-098.76", avatar:""
  },
  "tran-cong-toan-7": {
    id:"tran-cong-toan-7", stt:7, ten:"Trần Công Toàn", sdt:"0945626369",
    ngaysinh:"15/03/1990", cccd:"89090024416",
    diachi:"Mỹ Phú, Châu Phú, tỉnh An Giang",
    nghenghiep:"Kỹ sư điện tử", biensoxe:"51D-790.62", avatar:""
  }
};
// ================================================================

var SVG = {
  birthday:'<svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 1.5-2 4-2 4S10 5.5 10 4a2 2 0 0 1 2-2z"/><rect x="2" y="9" width="20" height="13" rx="2"/><path d="M2 15h20"/></svg>',
  id:      '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 15h4M7 11h2"/><circle cx="16" cy="11" r="2"/><path d="M14 15h4"/></svg>',
  pin:     '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  work:    '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  car:     '<svg viewBox="0 0 24 24"><path d="M5 17H3v-5l2.5-5h11L19 12v5h-2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M5 12h14"/></svg>',
  phone:   '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.07 6.07l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
};

function initial(name) {
  var p = name.trim().split(' ');
  return p[p.length-1].charAt(0).toUpperCase();
}

function item(iconKey, label, value) {
  return '<div class="info-item">'
    + '<div class="info-icon-wrap">' + SVG[iconKey] + '</div>'
    + '<div><div class="info-label">' + label + '</div>'
    + '<div class="info-value">' + (value||'—') + '</div></div>'
    + '</div>';
}

function render() {
  var root = document.getElementById('root');
  var id   = new URLSearchParams(window.location.search).get('id');
  var m    = members[id];

  if (!m) {
    root.innerHTML =
      '<div class="error-page">'
      + '<div class="err-icon">◈</div>'
      + '<h2>Không tìm thấy hội viên</h2>'
      + '<p>Mã QR không hợp lệ hoặc hội viên chưa đăng ký.</p>'
      + '<a href="generate_qr.html">← Quay lại danh sách</a>'
      + '</div>';
    return;
  }

  document.title = m.ten + ' · CLB';

  var av = (m.avatar && m.avatar !== '')
    ? '<img class="avatar-img" id="av" src="' + m.avatar + '" alt="' + m.ten + '">'
    : '<div class="avatar-circle">' + initial(m.ten) + '</div>';

  var sttPad = m.stt < 10 ? '0' + m.stt : '' + m.stt;
  var tenCuoi = m.ten.trim().split(' ').pop();

  root.innerHTML =
    '<div class="card">'
    + '<div class="stripe"></div>'
    + '<div class="header">'
    +   '<div class="stt-badge">No. ' + sttPad + '</div>'
    +   av
    +   '<div class="name-block">'
    +     '<h1>' + m.ten + '</h1>'
    +     '<span class="role-tag">✦ Hội viên CLB</span>'
    +   '</div>'
    + '</div>'
    + '<div class="info-section">'
    +   '<div class="section-title">Thông tin cá nhân</div>'
    +   item('birthday', 'Ngày sinh',                  m.ngaysinh)
    +   item('id',       'Số CCCD',                    m.cccd)
    +   item('pin',      'Địa chỉ',                    m.diachi)
    +   item('work',     'Nghề nghiệp / Nơi làm việc', m.nghenghiep)
    +   item('car',      'Biển số xe',                 m.biensoxe)
    +   item('phone',    'Số điện thoại',              m.sdt)
    + '</div>'
    + '<div class="card-footer">'
    +   '<a class="btn-back" href="generate_qr.html" title="Danh sách">←</a>'
    +   '<a class="btn-primary" href="tel:' + m.sdt + '">'
    +     '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.07 6.07l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
    +     'Gọi điện cho ' + tenCuoi
    +   '</a>'
    + '</div>'
    + '</div>';

  if (m.avatar && m.avatar !== '') {
    var img = document.getElementById('av');
    if (img) img.onerror = function() {
      var c = document.createElement('div');
      c.className = 'avatar-circle';
      c.textContent = initial(m.ten);
      img.parentNode.replaceChild(c, img);
    };
  }
}

render();
</script>
</body>
</html>
